[package]
name = "pdfcraft-cli"
description = "Rehman-PDF command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

# The shipped binary is RehmanPDF-cli.exe (T-018 brand scrub); the package name stays `pdfcraft-cli`.
[[bin]]
name = "RehmanPDF-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pdfcraft-render = { workspace = true }
serde_json = { workspace = true }
pdfcraft-engine = { workspace = true }
pdfcraft-audit = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-automation = { workspace = true }
pdfcraft-platform = { workspace = true }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for RehmanPDF-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`RehmanPDF-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["pdfcraft-automation/mcp"]
