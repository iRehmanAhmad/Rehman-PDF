<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- Rehman-PDF app mark: indigo tile, stacked pages, R. Contributor-original. -->
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#5B55F1"/>
<stop offset="1" stop-color="#4F46E5"/>
</linearGradient>
<clipPath id="tileclip"><rect width="512" height="512" rx="112"/></clipPath>
</defs>
<g clip-path="url(#tileclip)">
<rect width="512" height="512" fill="url(#tile)"/>
<g transform="rotate(-9 256 300)"><rect x="150" y="140" width="220" height="300" rx="26" fill="#DCDDFA"/></g>
<g transform="rotate(-4.5 280 300)"><rect x="172" y="146" width="220" height="300" rx="26" fill="#ECECFB"/></g>
<rect x="196" y="152" width="220" height="300" rx="26" fill="#FFFFFF"/>
<polygon points="416,152 416,208 360,152" fill="#C9CBEF"/>
<text x="306" y="376" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="168" font-weight="700" text-anchor="middle" fill="#4F46E5">R</text>
</g>
</svg>
